name: Assemble bundles

# Keeps the optional fresh-install bundles current. On a schedule (and on
# demand) it resolves the latest server and web releases; when the bundle for
# that pair does not exist yet, it assembles one and publishes it. Nothing
# here is required for regular installs — the installers compose from the
# component releases directly.
on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch: {}

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bundle:
    name: Assemble and publish a bundle
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve the latest component versions
        id: versions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          semver='^[0-9]+\.[0-9]+\.[0-9]+(-[A-Za-z0-9.]+)?$'
          server="$(gh api repos/ReelVault/reelvault/releases/latest --jq .tag_name)"
          web="$(gh api repos/ReelVault/website/releases/latest --jq .tag_name)"
          server="${server#v}"
          web="${web#v}"
          [[ "$server" =~ $semver ]] || { echo "::error::invalid server version: $server"; exit 1; }
          [[ "$web" =~ $semver ]] || { echo "::error::invalid web version: $web"; exit 1; }
          echo "server=$server" >> "$GITHUB_OUTPUT"
          echo "web=$web" >> "$GITHUB_OUTPUT"
          echo "Resolved server ${server}, web ${web}"

      # The web release declares the oldest server it works with; never publish
      # a pair the update service itself would refuse to install.
      - name: Check web/server compatibility
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER: ${{ steps.versions.outputs.server }}
          WEB: ${{ steps.versions.outputs.web }}
        run: |
          set -euo pipefail
          min="$(gh release download "v${WEB}" --repo ReelVault/website --pattern release.json --output - 2>/dev/null | jq -r '.minServerVersion // empty' || true)"
          if [ -z "$min" ]; then
            echo "Web v${WEB} declares no minimum server version"
            exit 0
          fi
          lowest="$(printf '%s\n%s\n' "$min" "$SERVER" | sort -V | head -1)"
          if [ "$lowest" != "$min" ]; then
            echo "::error::web v${WEB} needs server >= ${min}, latest is ${SERVER} — not publishing this pair"
            exit 1
          fi

      - name: Check whether this bundle already exists
        id: existing
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER: ${{ steps.versions.outputs.server }}
          WEB: ${{ steps.versions.outputs.web }}
        run: |
          set -euo pipefail
          if gh release view "v${SERVER}-web${WEB}" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "Bundle for this pair already exists — nothing to do"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache the pinned ffmpeg builds
        if: steps.existing.outputs.exists != 'true'
        uses: actions/cache@v4
        with:
          path: dist/cache/ffmpeg
          key: ffmpeg-${{ hashFiles('scripts/assemble.sh') }}

      - name: Assemble the bundle
        if: steps.existing.outputs.exists != 'true'
        env:
          SERVER: ${{ steps.versions.outputs.server }}
          WEB: ${{ steps.versions.outputs.web }}
        run: ./scripts/assemble.sh "$SERVER" "$WEB" --full

      # Draft first, publish last: an interrupted run leaves an invisible draft
      # instead of a half-filled public release that later runs would skip.
      - name: Publish the bundle release
        if: steps.existing.outputs.exists != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          SERVER: ${{ steps.versions.outputs.server }}
          WEB: ${{ steps.versions.outputs.web }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          tag="v${SERVER}-web${WEB}"
          assets=( dist/bundles/ReelVault-"${SERVER}"-web"${WEB}"-*.tar.gz dist/bundles/ReelVault-"${SERVER}"-web"${WEB}"-*.zip dist/bundles/SHA256SUMS.txt )
          [ "${#assets[@]}" -ge 4 ] || { echo "::error::expected 3 bundles plus SHA256SUMS.txt, found ${#assets[@]} files"; exit 1; }

          gh release delete "$tag" --repo "$GITHUB_REPOSITORY" --yes 2>/dev/null || true
          gh release create "$tag" --repo "$GITHUB_REPOSITORY" --draft \
            --title "ReelVault v${SERVER} + web v${WEB}" \
            --generate-notes \
            "${assets[@]}"
          gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --draft=false